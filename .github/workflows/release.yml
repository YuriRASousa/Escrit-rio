name: Release

# Publica o executável quando uma tag v* é empurrada, ou à mão pela aba Actions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # criar a release e a tag

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Não vale empacotar algo que não passa nos próprios testes.
      - name: Testes
        run: npm test

      - name: Ler a versao
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Só empacota. A publicação é feita adiante pelo gh, de propósito: o
      # publisher do electron-builder subia apenas o .blockmap e deixava os
      # .exe de fora, sem falhar o passo.
      - name: Empacotar
        run: npx electron-builder --win --publish never

      - name: Conferir o que foi gerado
        shell: bash
        run: |
          ls -lh release/*.exe
          test -n "$(ls release/*.exe 2>/dev/null)" || { echo "nenhum .exe gerado"; exit 1; }

      # Re-rodar tem de produzir uma release completa, não herdar a anterior.
      - name: Limpar release anterior desta versao
        shell: bash
        continue-on-error: true
        run: gh release delete "v${{ steps.ver.outputs.v }}" --yes --cleanup-tag || echo "nada a limpar"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Cria a tag, a release e anexa os instaladores num comando só.
      - name: Publicar a release com os instaladores
        shell: bash
        run: |
          gh release create "v${{ steps.ver.outputs.v }}" release/*.exe \
            --target "${{ github.sha }}" \
            --title "Escritorio dos Agentes v${{ steps.ver.outputs.v }}" \
            --notes-file docs/RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Falha o job se a release não ficou com os .exe anexados.
      - name: Conferir a release publicada
        shell: bash
        run: |
          n=$(gh release view "v${{ steps.ver.outputs.v }}" --json assets \
                --jq '[.assets[] | select(.name | endswith(".exe"))] | length')
          echo "instaladores anexados: $n"
          test "$n" -ge 1 || { echo "release saiu sem instalador"; exit 1; }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-instalador
          path: release/*.exe
          if-no-files-found: warn
